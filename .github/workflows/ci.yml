# Runs `make code check` (shellcheck, gofmt, Go vet and tests, web type-check and 100% coverage),
# the same command as on your computer; runtime/tool tests use Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: scripts/ops/go.mod
          # Docker caches its own tool builds; host Go runs the publication guard.
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: make code check

      - name: Build the runtime tools image
        run: docker compose -f local/compose.yaml build init
