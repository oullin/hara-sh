# Runs `make code check` (Go vet and tests, web type-check and 100% coverage),
# the same command as on your computer; runtime/tool tests use Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: scripts/ops/go.mod
          # Docker caches its own tool builds; host Go runs the publication guard.
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: make code check

      - name: Test the pinned proxy against upstream faults
        run: make code resilience

      - name: Build the runtime tools image
        run: docker compose -f local/compose.yaml build init
