# CLIProxyAPI config template (v8 layout).
#
# Contains 1Password references only. Render and upload it to R2 with:
#   make config-push
# The server reads config/config.yaml from the R2 bucket, not this file.
# Full option reference: upstream config.example.yaml.
config-version: 8

server:
  host: ""
  port: 8317

management:
  allow-remote: true
  # Replaced with a bcrypt hash of the 1Password value by scripts/config-push.sh.
  secret-key: "__MANAGEMENT_PASSWORD_BCRYPT__"
  disable-control-panel: false

access:
  api-keys:
    - "{{ op://YOUR_VAULT/YOUR_ITEM/api-key }}"

# Credential pool: 2x Claude OAuth + 1x Codex OAuth (logged in via the management panel).
routing:
  strategy: "round-robin"
  # Keep each conversation on one account so Claude/Codex prompt caches are reused;
  # fails over to the other account automatically when one is rate-limited.
  session-affinity: true
  session-affinity-ttl: "1h"

upstream:
  codex:
    # Cloudflare cuts idle proxied responses at 100s; upstream recommends 20s behind a proxy.
    stream-bootstrap-timeout: "20s"

oauth:
  # Overridden by the object store (R2 auths/ prefix); kept for clarity.
  auth-dir: "/data/auths"

observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false

# Plugin runtime (enabled from the management panel). Plugin binaries are installed
# into plugins.dir on the container disk, which is NOT persisted to R2.
plugins:
  enabled: true
  dir: "plugins"
