# CLIProxyAPI config template (v8 layout).
#
# Contains 1Password references only. `make local` renders it into
# ~/.cli-proxy-api/proxy/config.yaml, which the local server reads.
# Full option reference: upstream config.example.yaml.
config-version: 8

server:
  host: ""
  port: 8317

management:
  allow-remote: true
  # Replaced with a bcrypt hash of the 1Password value by render_config (scripts/lib/common.sh).
  secret-key: "__MANAGEMENT_PASSWORD_BCRYPT__"
  disable-control-panel: false
  # The panel is this repo's build (panel/management.html, mounted by local/compose.yaml);
  # never replace it with upstream's.
  disable-auto-update-panel: true

access:
  api-keys:
    # The only client key (Claude Code, scripts, ...). Codex uses its own ChatGPT login.
    - "{{ op://cloudflare/cli-proxy-api/claude-api-key }}"

# Credential pool: the provider accounts signed in through the management panel.
routing:
  # Picks the account for a session's first request only; affinity keeps it there afterwards.
  strategy: "round-robin"
  # Keep each conversation on one account, because prompt caches are per account:
  #   - Claude: keyed by the Claude Code session (X-Claude-Code-Session-Id / metadata.user_id).
  #     Native Claude Code keeps its own cache_control markers; the proxy only adds them for
  #     other clients (1h TTL on OAuth accounts).
  #   - Codex: keyed by prompt_cache_key, passed through from the client or derived from the
  #     session when absent, and sent upstream as Session-Id.
  # Fails over to another account when the bound one is rate-limited; the first turn there
  # rebuilds the cache. A bound session outranks priority, so `quota -route` boosts only
  # steer new sessions and failovers, never move a warm one.
  session-affinity: true
  # Matches Claude's 1h OAuth cache TTL; longer keeps bindings, not cache hits.
  session-affinity-ttl: "1h"
  # Upstream default, explicit: subagents run on the parent's account (cache reuse over
  # parallelism). false spreads them across the pool.
  session-affinity-subagents: true

upstream:
  codex:
    # Upstream recommends 20s when the server sits behind another proxy (portless, Tailscale).
    stream-bootstrap-timeout: "20s"

oauth:
  # ~/.cli-proxy-api/proxy/auths on this computer (mounted at /data).
  auth-dir: "/data/auths"

observability:
  logs:
    debug: false
    # Logs go to rotating 10 MB files under /data/logs (~/.cli-proxy-api/proxy/logs)
    # instead of stdout, so they are viewable in the panel and via `make logs`.
    logging-to-file: true
    # Retention: delete the oldest log files once the directory exceeds this size.
    # Upstream default is 0 (unbounded); rotation alone never deletes anything.
    logs-max-total-size-mb: 512
    # Keep at most this many request error logs (upstream default 10).
    error-logs-max-files: 10
    request-log: false

# Plugin runtime (enabled from the management panel). Plugin binaries are installed
# into plugins.dir inside the container and are lost when it is recreated.
plugins:
  enabled: true
  dir: "plugins"
