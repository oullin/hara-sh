# CLIProxyAPI config template (v8 layout).
#
# Contains 1Password references only. Render and upload it to R2 with:
#   make config-push
# The server reads config/config.yaml from the R2 bucket, not this file.
# Full option reference: upstream config.example.yaml.
config-version: 8

server:
  host: ""
  port: 8317

management:
  allow-remote: true
  # Replaced with a bcrypt hash of the 1Password value by scripts/push-config.sh.
  secret-key: "__MANAGEMENT_PASSWORD_BCRYPT__"
  disable-control-panel: false

access:
  api-keys:
    # Main key: every provider (Claude Code, scripts, ...).
    - "{{ op://YOUR_VAULT/YOUR_ITEM/claude-api-key }}"
    # Codex CLI key: the Worker limits it to Codex/GPT models, i.e. the Codex accounts only.
    - "{{ op://YOUR_VAULT/YOUR_ITEM/codex-api-key }}"

# Credential pool: 2x Claude OAuth + 1x Codex OAuth (logged in via the management panel).
routing:
  strategy: "round-robin"
  # Keep each conversation on one account so Claude/Codex prompt caches are reused;
  # fails over to the other account automatically when one is rate-limited.
  session-affinity: true
  session-affinity-ttl: "1h"

upstream:
  codex:
    # Cloudflare cuts idle proxied responses at 100s; upstream recommends 20s behind a proxy.
    stream-bootstrap-timeout: "20s"

oauth:
  # Overridden by the object store (R2 auths/ prefix); kept for clarity.
  auth-dir: "/data/auths"

observability:
  logs:
    debug: false
    # Logs go to rotating 10 MB files under /data/logs (container disk, 4 GB on "basic")
    # instead of stdout, so they are viewable in the panel and via `make logs`.
    # The disk is ephemeral: logs are lost when the container sleeps or restarts.
    logging-to-file: true
    # Retention: delete the oldest log files once the directory exceeds this size.
    # Upstream default is 0 (unbounded); rotation alone never deletes anything.
    logs-max-total-size-mb: 512
    # Keep at most this many request error logs (upstream default 10).
    error-logs-max-files: 10
    request-log: false

# Plugin runtime (enabled from the management panel). Plugin binaries are installed
# into plugins.dir on the container disk, which is NOT persisted to R2.
plugins:
  enabled: true
  dir: "plugins"
