# Docker Compose is the only server prerequisite. Private state stays outside Git.
# Run: docker compose -f local/compose.yaml up -d --build
name: cli-proxy-api-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-tools: &tools
  image: hara-tools:local
  build:
    context: ..
    dockerfile: scripts/tools/Dockerfile

services:
  init:
    <<: *tools
    command: ["init"]
    volumes:
      - ${LOCAL_DIR:-${HOME:?}/.hara-sh}:/state
      - ${HARA_CONFIG_TEMPLATE:-../config.yaml}:/template.yaml:ro
    restart: "no"

  proxy:
    image: eceasy/cli-proxy-api:v8.0.78@sha256:9ee2d80894763f712071e89adfe3b7e56458a3f600bb9fb9688ffeb067618e26
    init: true
    stop_grace_period: 30s
    logging: *logging
    ports:
      - "127.0.0.1:${HARA_PORT:-8317}:8317"
    command: ["./CLIProxyAPI", "-config", "/data/config.yaml"]
    environment:
      WRITABLE_PATH: /data
      MANAGEMENT_STATIC_PATH: /panel/management.html
      TZ: ${TZ:-UTC}
    volumes:
      - ${LOCAL_DIR:-${HOME:?}/.hara-sh}/proxy:/data
      # The directory, not the file: a file mount keeps the old inode after git or an editor
      # replaces panel/management.html, and the panel 404s until the proxy is recreated.
      - ../panel:/panel:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  quota:
    <<: *tools
    init: true
    logging: *logging
    command: ["quota", "-route", "-every", "1h"]
    environment:
      URL: http://proxy:8317
      TZ: ${TZ:-UTC}
    volumes:
      - ${LOCAL_DIR:-${HOME:?}/.hara-sh}/secrets:/state/secrets:ro
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

  # LAN and tailnet clients can reach inference routes through this listener only.
  ingress:
    <<: *tools
    command: ["ingress"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [default, edge]
    ports:
      - "127.0.0.1:${HARA_INGRESS_PORT:-8318}:8318"
    healthcheck:
      test: ["CMD", "/usr/local/bin/hara-tools", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      URL: http://127.0.0.1:8318
    depends_on:
      proxy:
        condition: service_healthy
    restart: unless-stopped

  # Optional private HTTPS access; enable with --profile tailscale.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    logging: *logging
    hostname: ${TS_HOSTNAME:-cliproxy}
    networks: [edge]
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cliproxy}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_BOOT_TIMEOUT: 8760h
    volumes:
      - ${LOCAL_DIR:-${HOME:?}/.hara-sh}/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      ingress:
        condition: service_healthy
    restart: unless-stopped

  # One-shot tools receive read-only secrets, never the Docker socket.
  tools:
    <<: *tools
    profiles: ["tools"]
    command: ["status"]
    environment:
      URL: ${TOOLS_URL:-http://proxy:8317}
      TZ: ${TZ:-UTC}
    volumes:
      - ${LOCAL_DIR:-${HOME:?}/.hara-sh}/secrets:/state/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  edge:
