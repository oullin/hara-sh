# Local proxy: CLIProxyAPI on this computer, reachable on your tailnet over HTTPS.
# Started by scripts/local.sh (`make up`), which sets LOCAL_DIR (default ~/.cli-proxy-api)
# and renders $LOCAL_DIR/proxy/config.yaml first.
# Upgrade CLIProxyAPI by bumping the proxy image tag below, then run `make up`.
name: cli-proxy-api-local

services:
  # Joins the tailnet as its own device and serves https://<TS_HOSTNAME>.<tailnet>.ts.net
  # to the proxy (serve.json). Userspace networking needs no extra privileges.
  # Until it is signed in, it restarts every minute; the proxy has its own network, so
  # localhost:8317 and hara.local keep working meanwhile.
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-cliproxy}
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cliproxy}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ${LOCAL_DIR:?}/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  # Config, OAuth logins and logs live in $LOCAL_DIR/proxy.
  proxy:
    image: eceasy/cli-proxy-api:v8.0.15
    # Published on this computer only. portless (on the host) forwards https://hara.local to it;
    # Docker Desktop offers no other way for a host process to reach a container.
    ports:
      - "127.0.0.1:8317:8317"
    command: ["./CLIProxyAPI", "-config", "/data/config.yaml"]
    environment:
      WRITABLE_PATH: /data
      # Serve this repo's panel build (scripts/build-panel.sh) instead of downloading upstream's.
      MANAGEMENT_STATIC_PATH: /panel/management.html
      # Singapore time (SGT) for log timestamps. The Tailscale image ships no zone data.
      TZ: Asia/Singapore
    volumes:
      - ${LOCAL_DIR:?}/proxy:/data
      - ../panel/management.html:/panel/management.html:ro
    restart: unless-stopped

  # Steers routing toward weekly capacity that would otherwise expire unused (scripts/quota): on
  # start and then hourly, it raises the priority of each account whose weekly window resets
  # within 24h with capacity left, and returns the others to the normal priority.
  quota:
    build: ../scripts/quota
    image: cli-proxy-api-quota:local
    command: ["-route", "-every", "1h"]
    environment:
      URL: http://proxy:8317
      MGMT_KEY_FILE: /run/secrets/management-password
      TZ: Asia/Singapore
    secrets:
      - management-password
    depends_on:
      - proxy
    restart: unless-stopped

secrets:
  # Written by scripts/local.sh from 1Password (owner-only); read by the quota service.
  management-password:
    file: ${LOCAL_DIR:?}/quota/management-password
